name: portfolio-local

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: portfolio-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  portfolio-postgres-data:
